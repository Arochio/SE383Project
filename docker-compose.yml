services:
  database:
    build:
      context: .
      dockerfile: Dockerfile
      target: database
    container_name: clicker-empire-database
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
    ports:
      - "1433:1433"
    volumes:
      - clicker-empire-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: clicker-empire-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__GameDatabase: "Server=database,1433;Database=ClickerEmpire;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True"
    ports:
      - "5228:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: clicker-empire-frontend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      BackendUrl: http://backend:8080
    ports:
      - "5000:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  clicker-empire-sql-data:
